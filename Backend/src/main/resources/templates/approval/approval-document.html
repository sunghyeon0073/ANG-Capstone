<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @font-face {
            font-family: 'NanumGothic';
            src: url('/fonts/NanumGothic.ttf');
        }
        * {
            font-family: 'NanumGothic', sans-serif;
            box-sizing: border-box;
        }
        body {
            margin: 40px;
            font-size: 12px;
            color: #000;
        }
        h1.doc-title {
            text-align: center;
            font-size: 20px;
            margin-bottom: 10px;
        }
        /* 결재란 표 */
        .approval-table-wrap {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .approval-table {
            border-collapse: collapse;
            font-size: 11px;
        }
        .approval-table th, .approval-table td {
            border: 1px solid #333;
            padding: 4px 8px;
            text-align: center;
            min-width: 60px;
        }
        .approval-table th {
            background-color: #f0f0f0;
        }
        .signature-img {
            max-width: 50px;
            max-height: 40px;
        }
        /* 문서 본문 */
        .doc-info {
            margin-bottom: 16px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
        }
        .doc-info table {
            width: 100%;
            border-collapse: collapse;
        }
        .doc-info td {
            padding: 4px 8px;
            font-size: 12px;
        }
        .doc-info td:first-child {
            font-weight: bold;
            width: 80px;
            color: #555;
        }
        .form-content {
            border: 1px solid #ccc;
            padding: 16px;
            min-height: 300px;
            white-space: pre-wrap;
            line-height: 1.8;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 10px;
            color: #999;
        }
    </style>
</head>
<body>

    <!-- 결재란 (우측 상단) -->
    <div class="approval-table-wrap">
        <table class="approval-table">
            <thead>
                <tr>
                    <th th:each="line : ${approvalLines}" th:text="${line.lineType.name()}">결재</th>
                </tr>
                <tr>
                    <td th:each="line : ${approvalLines}" th:text="${line.approver.position}">직위</td>
                </tr>
                <tr>
                    <td th:each="line : ${approvalLines}" th:text="${line.approver.name}">성명</td>
                </tr>
                <tr>
                    <td th:each="line : ${approvalLines}">
                        <img th:if="${line.signatureSnapshot != null}"
                             th:src="${line.signatureSnapshot}"
                             class="signature-img"
                             alt="서명"/>
                        <span th:if="${line.signatureSnapshot == null}">-</span>
                    </td>
                </tr>
                <tr>
                    <td th:each="line : ${approvalLines}"
                        th:text="${line.processedAt != null ? #temporals.format(line.processedAt, 'MM/dd') : '-'}">날짜</td>
                </tr>
            </thead>
        </table>
    </div>

    <!-- 문서 제목 -->
    <h1 class="doc-title" th:text="${doc.title}">문서 제목</h1>

    <!-- 기본 정보 -->
    <div class="doc-info">
        <table>
            <tr>
                <td>기안자</td>
                <td th:text="${doc.drafter.name + ' (' + doc.drafter.position + ')'}">홍길동 (팀장)</td>
            </tr>
            <tr>
                <td>기안일</td>
                <td th:text="${#temporals.format(doc.createdAt, 'yyyy-MM-dd')}">2025-01-01</td>
            </tr>
            <tr>
                <td>완료일</td>
                <td th:text="${doc.completedAt != null ? #temporals.format(doc.completedAt, 'yyyy-MM-dd') : '-'}">2025-01-02</td>
            </tr>
            <tr th:if="${doc.template != null}">
                <td>양식</td>
                <td th:text="${doc.template.title}">양식명</td>
            </tr>
        </table>
    </div>

    <!-- 본문 내용 -->
    <div class="form-content" th:text="${doc.formData}">
        본문 내용이 여기에 표시됩니다.
    </div>

    <div class="footer">
        이 문서는 전자결재 시스템에서 생성된 공식 문서입니다.
    </div>

</body>
</html>
